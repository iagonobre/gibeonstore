<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GibeonStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>GibeonStore</h1>

  <main>
    <section>
      <h2>Cadastrar Produto</h2>
      <form id="form-cadastrar">
        <label>Código <input name="codigo"></label>
        <label>Preço <input name="preco"></label>
        <button type="submit">Cadastrar</button>
      </form>
    </section>

    <section>
      <h2>Consultar Estoque</h2>
      <form id="form-consultar">
        <label>Código <input name="codigo"></label>
        <button type="submit">Consultar</button>
      </form>
    </section>
  </main>

  <h2>Resultado</h2>
  <pre id="resultado">Nenhuma requisição feita ainda.</pre>

  <script src="app.js"></script>
</body>
</html>
